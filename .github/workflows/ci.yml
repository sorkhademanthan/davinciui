name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter web typecheck

      - name: Lint (errors only)
        run: pnpm --filter web exec eslint . --quiet

      - name: Validate registry
        run: pnpm validate:registry

      - name: Validate docs
        run: pnpm validate:docs

      - name: Check asset budget
        run: pnpm check:assets

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Build
        run: pnpm --filter web build
