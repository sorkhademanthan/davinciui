<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FannedDeck · local demo</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #101014;
        color: #e8e8ec;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      main {
        padding: 16px;
      }
      h1 {
        font-size: 15px;
        font-weight: 600;
        margin: 0 0 8px;
      }
      .hud {
        font-size: 12px;
        color: #9a9aa4;
        margin-bottom: 12px;
      }
      .stage {
        position: relative;
        width: 100%;
        height: 675px;
        margin-bottom: 24px;
        border-radius: 12px;
        overflow: hidden;
      }
      button {
        font: inherit;
        font-size: 12px;
        padding: 6px 12px;
        border-radius: 6px;
        border: 1px solid #2c2c34;
        background: #1a1a20;
        color: #e8e8ec;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
