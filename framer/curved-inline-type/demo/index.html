<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CurvedInlineType · local demo</title>
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="./assets/fonts/FunnelDisplay-latin.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="./assets/fonts/Inter-latin.woff2"
      crossorigin
    />
    <style>
      @font-face {
        font-family: "Funnel Display";
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url("./assets/fonts/FunnelDisplay-latin.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC,
          U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F,
          U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Funnel Display";
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url("./assets/fonts/FunnelDisplay-latin-ext.woff2") format("woff2");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7,
          U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F,
          U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F,
          U+A720-A7FF;
      }
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url("./assets/fonts/Inter-latin.woff2") format("woff2");
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0b0b0e;
      }
      * {
        box-sizing: border-box;
      }
      body {
        overflow-x: hidden;
      }
      #root {
        min-height: 100vh;
      }
      .debug {
        position: fixed;
        left: 16px;
        bottom: 16px;
        z-index: 50;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 8px 12px;
        border-radius: 8px;
        border: 1px solid #2a2a32;
        background: rgba(15, 15, 20, 0.9);
        color: #b7b7c2;
        font: 12px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .debug label {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .debug select {
        font: inherit;
        color: inherit;
        background: #17171e;
        border: 1px solid #2a2a32;
        border-radius: 4px;
        padding: 2px 4px;
      }
      #debug-readout {
        color: #7e7e8a;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
